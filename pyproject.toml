[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evaluation-platform"
version = "0.1.0"
description = "SQLite-first evaluation platform for API-hosted LLMs and SLMs"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43,<45",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pyarrow>=16,<20",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
postgresql = [
  "psycopg[binary]>=3.2,<4.0",
]
mongodb = [
  "pymongo>=4.6,<5.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["backend"]
testpaths = ["tests"]
