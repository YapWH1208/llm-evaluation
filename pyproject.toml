[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evaluation-platform"
version = "1.0.0"
description = "SQLite-first evaluation platform for API-hosted LLMs and SLMs"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43,<45",
  "fastapi>=0.115,<1.0",
  "httpcore>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "pydantic>=2.7,<3.0",
  "regex>=2024.9,<2026.0",
  "sqlalchemy>=2.0,<3.0",
  "starlette>=0.40,<0.42",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
mongodb = [
  "pymongo>=4.6,<5.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["backend"]
testpaths = ["tests"]
