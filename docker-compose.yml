services:
  api:
    build: .
    environment:
      LLE_DATABASE_URL: "sqlite:////data/llm_evaluation.db"
      LLE_SECRET_ENCRYPTION_KEY: "${LLE_SECRET_ENCRYPTION_KEY:?Set LLE_SECRET_ENCRYPTION_KEY before starting Compose}"
      LLE_CORS_ORIGINS: http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped
