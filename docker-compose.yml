services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lle
      POSTGRES_USER: lle
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lle -d lle"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LLE_DATABASE_URL: postgresql+psycopg://lle:change-me@postgres:5432/lle
      LLE_SECRET_ENCRYPTION_KEY: replace-with-a-Fernet-key
      LLE_CORS_ORIGINS: http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data

volumes:
  postgres-data:
