services:
  api:
    build: .
    environment:
      LLE_DATABASE_URL: "sqlite:////data/llm_evaluation.db"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped
