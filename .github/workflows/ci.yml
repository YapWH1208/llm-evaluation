name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install ".[dev]"
      - name: Run Ruff lint
        run: python -m ruff check backend tests
      - name: Check Ruff formatting for consolidated modules
        run: python -m ruff format --check backend/app/infrastructure/providers/registry.py backend/app/infrastructure/network/outbound.py backend/app/modules/evaluations/lifecycle.py
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend lint
        run: npm run lint
      - name: Run frontend tests
        run: npm test -- --run
      - name: Build frontend
        run: npm run build
